<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documento · Australia</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#155f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Australia">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{--sand:#f3e9da;--paper:#fdf8f0;--ink:#2c2420;--ink-soft:#5e5147;--teal-deep:#155f5a;--line:rgba(44,36,32,.13)}
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9dfd0;color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--teal-deep);color:var(--paper);
    box-shadow:0 4px 14px -8px rgba(0,0,0,.5)}
  .bar button,.bar a{font:600 15px/1 'Hanken Grotesk',system-ui,sans-serif;color:var(--paper);background:rgba(255,255,255,.14);
    border:0;border-radius:10px;padding:9px 12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .bar .t{flex:1;min-width:0}
  .bar .t b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .t small{display:block;font-size:12px;opacity:.75;margin-top:2px}
  #pages{padding:12px 8px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
  #pages canvas{width:100%;max-width:900px;height:auto;background:#fff;border-radius:4px;box-shadow:0 2px 10px -4px rgba(0,0,0,.35)}
  .lock input{display:block;width:100%;margin:14px 0 10px;font:500 17px/1.2 'Hanken Grotesk',system-ui,sans-serif;padding:12px 14px;border:1px solid rgba(44,36,32,.25);border-radius:11px;background:#fff;color:var(--ink)}
  .lock button{width:100%;font:700 16px/1 'Hanken Grotesk',system-ui,sans-serif;padding:13px;border:0;border-radius:11px;background:var(--teal-deep);color:var(--paper)}
  .lock b{font-family:'Fraunces',Georgia,serif;font-size:19px;color:var(--ink)}
  .msg{max-width:520px;margin:40px auto;padding:20px;background:var(--paper);border-radius:14px;text-align:center;line-height:1.5;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="bar">
  <button id="back" aria-label="Indietro">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Indietro
  </button>
  <div class="t"><b id="title">Documento</b><small id="info">caricamento…</small></div>
  <button id="share" aria-label="Condividi o salva il PDF" title="Condividi / salva">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
  </button>
</div>
<div id="pages"></div>

<script src="lib/pdfjs/pdf.min.js"></script>
<script src="Documenti_cifrati/chiave.js"></script>
<script src="lib/doccrypt.js"></script>
<script>
(function(){
  var f = new URLSearchParams(location.search).get('f') || '';
  var box = document.getElementById('pages');
  var info = document.getElementById('info');
  document.getElementById('back').onclick = function(){
    if(history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) history.back();
    else location.href = 'index.html';
  };
  if(!/^Documenti\/[^/]+\.pdf$/i.test(f)){   /* solo i documenti di questo sito */
    box.innerHTML = '<div class="msg">Documento non trovato.</div>'; info.textContent = ''; return;
  }
  var fileName = decodeURIComponent(f.split('/').pop());
  var name = fileName.replace(/\.pdf$/i, '').replace(/_/g, ' ');
  document.getElementById('title').textContent = name;
  document.title = name + ' · Australia';
  var pdfBytes = null;

  document.getElementById('share').onclick = async function(){
    if(!pdfBytes) return;
    var file = new File([pdfBytes], fileName, {type: 'application/pdf'});
    try{
      if(navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    var u = URL.createObjectURL(file); var a = document.createElement('a'); a.href = u; a.download = fileName; a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 10000);
  };

  function askPassword(msg){
    info.textContent = 'protetto';
    box.innerHTML = '<form class="msg lock" id="lockf"><b>Documenti protetti</b><br>' + (msg || 'Inserisci la password del viaggio. Basta una volta su questo telefono.') +
      '<input id="pw" type="password" autocomplete="current-password" placeholder="password" required>' +
      '<button type="submit">Sblocca</button></form>';
    var form = document.getElementById('lockf');
    document.getElementById('pw').focus();
    form.onsubmit = async function(e){
      e.preventDefault();
      var btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Controllo…';
      var ok = false; try{ ok = await AusDocs.unlock(document.getElementById('pw').value); }catch(err){ console.error(err); }
      if(ok) load(); else askPassword('<span style="color:#a23f22">Password sbagliata, riprova.</span>');
    };
  }

  async function load(){
    if(!AusDocs.isUnlocked()) return askPassword();
    info.textContent = 'caricamento…'; box.innerHTML = '';
    var buf;
    try{
      var r = await fetch(AusDocs.encPath(f));
      if(!r.ok) throw new Error('HTTP ' + r.status);
      buf = await r.arrayBuffer();
    }catch(err){
      console.error(err); info.textContent = 'errore';
      box.innerHTML = '<div class="msg">Non trovo il documento' + (navigator.onLine ? '.' :
        ': non è ancora stato salvato sul telefono. Riapri l\'app con internet e attendi «Pronto offline».') + '</div>';
      return;
    }
    try{ pdfBytes = await AusDocs.decrypt(buf); }
    catch(err){ console.error(err); AusDocs.lock(); return askPassword('<span style="color:#a23f22">La chiave salvata non è più valida: reinserisci la password.</span>'); }
    render(new Uint8Array(pdfBytes.slice(0)));
  }

  function render(data){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdfjs/pdf.worker.min.js';
    pdfjsLib.getDocument({data: data, isEvalSupported: false}).promise.then(async function(pdf){
      info.textContent = pdf.numPages + (pdf.numPages === 1 ? ' pagina' : ' pagine');
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for(var i = 1; i <= pdf.numPages; i++){
        var page = await pdf.getPage(i);
        var base = page.getViewport({scale: 1});
        var cssW = Math.min(box.clientWidth - 16, 900);
        var vp = page.getViewport({scale: cssW / base.width * dpr});
        var c = document.createElement('canvas');
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute('aria-label', 'Pagina ' + i);
        box.appendChild(c);
        await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
      }
    }).catch(function(err){
      console.error(err); info.textContent = 'errore';
      box.innerHTML = '<div class="msg">Non riesco a mostrare questo PDF.</div>';
    });
  }
  load();
})();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
